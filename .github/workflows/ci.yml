name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Enable unprivileged user namespaces (for sandbox tests)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # Verify
          unshare --user -- true && echo "unshare --user: OK" || echo "unshare --user: FAILED"

      - name: Unit tests with coverage
        run: cargo llvm-cov --all --no-fail-fast --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload coverage to job summary
        run: |
          echo '## 📊 Test Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report --summary-only 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

      - name: Build release
        run: |
          cargo build --release
          cp target/release/rune target/release/rune-base

      - name: E2E tests
        run: ./tests/e2e.sh

      - name: Build release (notes feature)
        run: |
          cargo build --release --features notes
          cp target/release/rune target/release/rune-notes

      - name: Binary size
        run: |
          echo '## 📦 Binary Sizes' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh target/release/rune-base target/release/rune-notes >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh target/release/rune-base target/release/rune-notes

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            target/release/rune-base
            target/release/rune-notes
          retention-days: 30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and package browser extensions
        run: |
          node browser-extension/build.js
          (cd browser-extension/dist/chrome && zip -r ../rune-extension-chrome.zip .)
          (cd browser-extension/dist/firefox && zip -r ../rune-extension-firefox.zip .)

      - name: Extension zip size
        run: |
          echo '## 🧩 Browser Extension Sizes' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh browser-extension/dist/*.zip >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh browser-extension/dist/*.zip

      - name: Upload browser extensions
        uses: actions/upload-artifact@v7
        with:
          name: browser-extensions
          path: |
            browser-extension/dist/rune-extension-chrome.zip
            browser-extension/dist/rune-extension-firefox.zip
          retention-days: 30

